# The ken/ folder is a pre-built static site (Docusaurus output for the Ken
# Agent docs) copied in verbatim by the deploy workflow after this Jekyll
# build step. Excluding it here stops Jekyll's Liquid engine from parsing
# its bundled JS/JSON (which contains "{...}" that looks like Liquid tags)
# and corrupting the output.
exclude:
  - ken
  # Internal project docs; keep them out of the published Pages site.
  - AGENTS.md
  - ARCHITECTURE.md
  - CODE_STYLE.md
  - DATABASE.md
  - DESIGN_SYSTEM.md
  - PRD.md
  - SECURITY.md
  - TESTING.md
